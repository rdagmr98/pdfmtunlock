<style>
:root {
  --bg: #14100c;
  --surface: #1e1712;
  --well: #251c15;
  --border: #3a2c20;
  --text: #f5ede3;
  --text-dim: #a89686;
  --text-faint: #786a5c;
  --accent: #ff6e40;
  --accent-soft: rgba(255, 110, 64, 0.16);
  --danger: #ff6b6b;
  --radius: 18px;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.25rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.page {
  width: 100%;
  max-width: 360px;
  display: flex;
  flex-direction: column;
  gap: 1.75rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  box-shadow: 0 0 0 1px var(--border);
  flex-shrink: 0;
}

.brand-eyebrow {
  margin: 0;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.brand h1 {
  margin: 0.1rem 0 0;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.75rem 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.field-label {
  margin: 0;
  font-size: 0.8rem;
  color: var(--text-dim);
  text-align: center;
}

.digit-input {
  width: 100%;
  margin-top: 0.5rem;
  background: var(--well);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 2rem;
  letter-spacing: 0.5em;
  text-align: center;
  padding: 0.75rem 0.5rem 0.75rem calc(0.5rem + 0.4em);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.digit-input::placeholder {
  color: var(--text-faint);
  opacity: 0.55;
}

.digit-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.error {
  margin: 0.5rem 0 0;
  font-size: 0.85rem;
  color: var(--danger);
  text-align: center;
}

.result-block {
  margin-top: 0.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  width: 100%;
}

.arrow {
  color: var(--text-faint);
  margin-bottom: 0.15rem;
}

.result {
  appearance: none;
  border: none;
  background: none;
  color: var(--accent);
  font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 3rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  padding: 0.15em 0.15em 0.15em 0.45em;
  cursor: pointer;
  border-radius: 10px;
  transition: transform 0.1s ease, opacity 0.1s ease;
}

.result:active {
  transform: scale(0.97);
  opacity: 0.85;
}

.result:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

.hint {
  margin: 0;
  font-size: 0.75rem;
  color: var(--text-faint);
}

.footnote {
  margin: 0;
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-faint);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 2rem;
  transform: translate(-50%, 12px);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.6rem 1.1rem;
  border-radius: 999px;
  font-size: 0.85rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

    <div>
      <p class="brand-eyebrow">PDF Magic Tool</p>
      <h1>Sblocco</h1>
    </div>
  </header>

  <main class="card">
    <label class="field-label" for="device-id">Codice dispositivo (dal PC)</label>
    <input id="device-id" class="digit-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="0000" autofocus>
    <p id="error" class="error" hidden></p>

    <div id="result-block" class="result-block" hidden>
      <span class="arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v14M6 12l6 6 6-6"></path></svg>
      </span>
      <p class="field-label">Codice di sblocco</p>
      <button type="button" id="result" class="result" aria-live="polite"></button>
      <p class="hint">Tocca per copiare</p>
    </div>
  </main>

  <p class="footnote">Calcolato sul dispositivo — nessun dato inviato altrove.</p>
</div>

<div id="toast" class="toast" role="status" aria-live="polite">Copiato</div>

<script>
(function () {
  var SALT = 'PMTv3Xk9Qz2LrN7wEb4Yt8s';
  var input = document.getElementById('device-id');
  var errorEl = document.getElementById('error');
  var resultBlock = document.getElementById('result-block');
  var resultEl = document.getElementById('result');
  var toast = document.getElementById('toast');

  async function computeUnlockKey(deviceId) {
    var bytes = new TextEncoder().encode(SALT + '-' + deviceId);
    var digestBuf = await crypto.subtle.digest('SHA-256', bytes);
    var hex = Array.from(new Uint8Array(digestBuf))
      .map(function (b) { return b.toString(16).padStart(2, '0'); })
      .join('');
    var n = parseInt(hex.slice(0, 8), 16);
    return String((n % 9000) + 1000);
  }

  var requestId = 0;
  async function handleInput() {
    var raw = input.value;
    var id = ++requestId;
    if (raw.length === 0) {
      errorEl.hidden = true;
      resultBlock.hidden = true;
      return;
    }
    if (raw.length !== 4) {
      errorEl.textContent = 'Inserisci le 4 cifre del codice dispositivo';
      errorEl.hidden = false;
      resultBlock.hidden = true;
      return;
    }
    errorEl.hidden = true;
    var key = await computeUnlockKey(parseInt(raw, 10));
    if (id !== requestId) return;
    resultEl.textContent = key;
    resultBlock.hidden = false;
  }

  input.addEventListener('input', function () {
    input.value = input.value.replace(/\D/g, '').slice(0, 4);
    handleInput();
  });

  resultEl.addEventListener('click', async function () {
    try {
      await navigator.clipboard.writeText(resultEl.textContent);
    } catch (e) {
      try {
        var range = document.createRange();
        range.selectNodeContents(resultEl);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        document.execCommand('copy');
      } catch (e2) {}
    }
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toast.classList.remove('show'); }, 1200);
  });
})();
</script>
